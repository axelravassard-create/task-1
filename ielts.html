<style>
:root{--bg:#0f172a;--card:#1b2744;--card2:#22304f;--txt:#eef2ff;--muted:#9fb0d0;--line:#2e3d60;
  --acc:#6ee7b7;--acc2:#38bdf8}
html[data-theme="light"]{--bg:#f4f7fb;--card:#fff;--card2:#eef3fb;--txt:#12203a;--muted:#5b6b88;
  --line:#dbe4f0;--acc:#0f9d76;--acc2:#0284c7}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg)}
body{display:flex;flex-direction:column;height:100dvh;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#bar{flex:0 0 auto;background:var(--card);border-bottom:2px solid var(--acc2);
  padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;display:flex;gap:6px;justify-content:center;align-items:center;
  box-shadow:0 4px 14px rgba(0,0,0,.25);position:relative;z-index:5}
#barlbl{font-weight:800;font-size:14px;color:var(--txt);margin-right:8px;white-space:nowrap}
@media(max-width:560px){#barlbl{display:none}}
.tab{flex:1 1 0;max-width:170px;background:var(--card2);border:2px solid var(--acc2);color:var(--txt);
  font-family:inherit;font-size:11.5px;font-weight:700;padding:5px 2px 6px;border-radius:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:1px;white-space:nowrap;overflow:hidden}
.tab .ic{font-size:17px;line-height:1.15}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06202b;border-color:transparent;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent)}
.tab:not(.on):hover{background:color-mix(in srgb,var(--acc2) 18%,var(--card2))}
.tab:active{transform:scale(.97)}
#frames{flex:1 1 auto;position:relative;background:var(--bg)}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#frames iframe.on{display:block}
</style>
</head>

<script>
"use strict";
const APPS = {};
APPS.t1 = `<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>IELTS Writing Task 1 — Entraînement</title>
<style>
:root{
  --bg:#0f172a; --bg2:#131f3a; --card:#1b2744; --card2:#22304f;
  --txt:#eef2ff; --muted:#9fb0d0; --line:#2e3d60;
  --acc:#6ee7b7; --acc2:#38bdf8; --warn:#fbbf24; --bad:#fb7185; --good:#34d399;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:16px;
}
:root[data-theme="light"]{
  --bg:#f4f7fb; --bg2:#ffffff; --card:#ffffff; --card2:#eef3fb;
  --txt:#12203a; --muted:#5b6b88; --line:#dbe4f0;
  --acc:#0f9d76; --acc2:#0284c7; --warn:#b45309; --bad:#e11d48; --good:#0f9d76;
  --shadow:0 8px 24px rgba(16,34,64,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 600px at 20% -10%, var(--bg2), var(--bg)) fixed;
  color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:40px;
}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);
  background:color-mix(in srgb, var(--bg) 82%, transparent);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.logo{font-weight:800;font-size:16px;letter-spacing:.2px;flex:1;min-width:0;line-height:1.25}
.logo small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;
  padding:8px 10px;font-size:14px;cursor:pointer}
.iconbtn:active{transform:scale(.96)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;text-align:center}
.stat b{display:block;font-size:16px;line-height:1.2}
.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--muted);
  padding:9px 13px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.tab.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06202b;border-color:transparent}
.panel{display:none;animation:fade .25s ease}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,.chip{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;font-size:13px;font-family:inherit}
.chip{cursor:pointer;font-weight:600}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06202b;border-color:transparent}
.btn{border:none;border-radius:12px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;
  font-family:inherit;background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn:active{transform:scale(.98)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06202b;border-color:transparent}
.btn.good{background:rgba(52,211,153,.18);border-color:var(--good);color:var(--good)}
.btn.bad{background:rgba(251,113,133,.16);border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.muted{color:var(--muted);font-size:13px}
.hrow .navswitch{flex:1 1 100%;justify-content:center;margin-top:2px;order:3}
.hrow .iconbtn{order:2}
.hrow .logo{flex:1 1 60%;min-width:0}
.navswitch{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px}
.navswitch a{font-size:11.5px;font-weight:700;color:var(--muted);text-decoration:none;border-radius:999px;
  padding:6px 11px;white-space:nowrap}
.navswitch a.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06202b}
.switch{font-size:11.5px;font-weight:700;color:var(--acc2);text-decoration:none;border:1px solid var(--line);
  background:var(--card);border-radius:999px;padding:6px 10px;white-space:nowrap}
.tagcat{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--acc2);background:color-mix(in srgb,var(--acc2) 14%,transparent);border-radius:999px;padding:3px 10px}

/* Flashcards */
.flipwrap{perspective:1200px;margin:6px 0 14px}
.flip{position:relative;width:100%;min-height:250px;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.flip.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:18px 16px;overflow:auto}
.face .inner{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;
  text-align:center;gap:10px}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--card2),var(--card))}
.face .term{font-size:23px;font-weight:800;line-height:1.3}
.face .term.long{font-size:17.5px;line-height:1.35}
svg.ill{width:100%;max-width:240px;height:auto;display:block;margin:2px auto}
.ill-cap{font-size:11px;color:var(--muted);margin-top:-4px}
.tip{font-size:13px;line-height:1.45;color:var(--txt);background:var(--card2);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;text-align:left;width:100%}
.tip b{color:var(--acc)}
.ex{font-size:13px;line-height:1.45;text-align:left;width:100%;border-left:3px solid var(--acc2);padding-left:10px}
.ex i{color:var(--txt);font-weight:600}
.ex.ko{border-left-color:var(--bad)}
.ex.ko i{color:var(--bad);font-weight:600}
.exwrap{display:grid;gap:8px;width:100%}
.exrow{font-size:12.5px;line-height:1.45;padding-top:0}
.exrow div{margin:2px 0}
.exrow .k{color:var(--bad)}
.exrow .o{color:var(--acc)}
.exrow em{color:var(--muted);font-style:normal}
.ex span{display:block;color:var(--muted);font-size:12px}
.fb svg.ill{max-width:210px;margin-top:8px}
.memoart{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
@media(min-width:620px){.memoart{grid-template-columns:repeat(3,1fr)}}
.memoart figure{margin:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.memoart figcaption{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.3}
.face .sub.small{font-size:12px;line-height:1.45}
.face .sub{font-size:13px;color:var(--muted)}
.hint{font-size:11px;color:var(--muted);position:absolute;bottom:10px;left:0;right:0;text-align:center}

/* Quiz */
.q{font-size:18px;font-weight:700;margin:6px 0 14px;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--card2);border:1px solid var(--line);color:var(--txt);
  border-radius:12px;padding:13px 14px;font-size:14.5px;font-family:inherit;cursor:pointer;line-height:1.35}
.opt:hover{border-color:var(--acc2)}
.opt.correct{background:rgba(52,211,153,.18);border-color:var(--good)}
.opt.wrong{background:rgba(251,113,133,.16);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px;border-radius:12px;font-size:14px;border:1px solid var(--line);background:var(--card2)}
.fb b{color:var(--acc)}
.fb.err b{color:var(--bad)}

/* Classement */
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
@media(min-width:620px){.cats{grid-template-columns:repeat(3,1fr)}}
.catbtn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;
  padding:12px 8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;line-height:1.25}
.catbtn.correct{background:rgba(52,211,153,.2);border-color:var(--good)}
.catbtn.wrong{background:rgba(251,113,133,.18);border-color:var(--bad)}
.timerbar{height:7px;border-radius:999px;background:var(--card2);overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.timerbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:100%}
.bigterm{font-size:24px;font-weight:800;text-align:center;padding:18px 6px;line-height:1.3}

/* Mémo */
.acc{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px;background:var(--card)}
.acc>summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:15px;list-style:none;display:flex;gap:10px;align-items:center}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:20px}
.acc[open]>summary::after{content:"–"}
.accbody{padding:0 16px 16px;font-size:14.5px}
.accbody ul{padding-left:20px;margin:8px 0}
.accbody li{margin:5px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td.en{font-weight:700}
.box{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14px;border-left:4px solid}
.box.bad{background:rgba(251,113,133,.10);border-color:var(--bad)}
.box.good{background:rgba(52,211,153,.10);border-color:var(--good)}
.box.warn{background:rgba(251,191,36,.10);border-color:var(--warn)}
.box h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}

/* Progrès */
.bar{height:9px;background:var(--card2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.plist{display:grid;gap:10px;margin-top:10px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13.5px}
.pitem .bar{grid-column:1/3}
.revlist{display:grid;gap:8px;margin-top:10px}
.revitem{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06202b;font-weight:800;padding:10px 18px;
  border-radius:999px;font-size:14px;pointer-events:none;transition:.3s;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 0 10px}
.center{text-align:center}
.sp{height:10px}
</style>
<style>.navswitch{display:none!important}</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <div class="logo">📊 IELTS Writing Task 1
        <small>Entraînement mémoire — vocabulaire &amp; méthodologie</small>
      </div>
      <div class="navswitch"><a href="index.html" class="on">📊 Task 1</a><a href="task2.html">✍️ Task 2</a><a href="exam.html#corriges">📗 Corrigés</a><a href="exam.html">⏱️ Examens</a></div>

</header>

<main class="wrap">

<!-- ===================== FLASHCARDS ===================== -->
<section class="panel on" id="p-flash">
  <div class="toolbar">
    <select id="fDeck"></select>
    <select id="fDir">

<!-- ===================== MÉMO ===================== -->
<section class="panel" id="p-memo">
  <p class="muted">Toute la fiche de révision. Rien à mémoriser ici tout de suite : servez-vous-en pour vérifier vos réponses.</p>

  <details class="acc" open><summary>⏱️ 1. Structure et minutage</summary>
    <div class="accbody">
      <ul>
        <li><b>Introduction (1 phrase)</b> : reformuler la consigne avec ses propres mots.</li>
        <li><b>Overview (2–3 phrases, OBLIGATOIRE)</b> : les tendances générales les plus frappantes, <b>sans aucun chiffre précis</b>.</li>
        <li><b>Corps (2 paragraphes)</b> : les détails chiffrés, regroupés logiquement — <b>jamais une liste plate</b>.</li>
        <li><b>Jamais d&rsquo;opinion</b>, <b>jamais de spéculation sur les causes</b>.</li>
        <li><b>150 mots minimum.</b></li>
      </ul>
      <div id="memoTiming"></div>
      <div class="box warn"><h4>Minutage sur 20 minutes</h4>
        <b>2 min</b> analyse des données → <b>3 min</b> préparation mentale de l&rsquo;overview → <b>13 min</b> rédaction → <b>2 min</b> relecture.
      </div>
    </div>
  </details>

  <details class="acc"><summary>📊 2. Méthodologie par type de graphique</summary>
    <div class="accbody">
      <table>
        <tr><th>Type</th><th>Ce qu&rsquo;il faut faire</th></tr>
        <tr><td class="en">Bar chart / Line graph</td><td>Tendances et comparaisons entre catégories ou dans le temps.</td></tr>
        <tr><td class="en">Pie chart (camembert)</td><td>Comparer des <b>parts d&rsquo;un tout</b>, pas des tendances. Utiliser fractions / proportions. Une différence entre deux pourcentages se dit en <b>percentage points</b>, jamais en <i>percent</i>.</td></tr>
        <tr><td class="en">Table</td><td>Repérer les <b>regroupements</b> avant d&rsquo;écrire (plus haut, plus bas, stable, exception). Ne <b>jamais</b> décrire ligne par ligne dans l&rsquo;ordre.</td></tr>
        <tr><td class="en">Process diagram</td><td>Pas de dates ni de chiffres. <b>Voix passive</b>, <b>présent simple</b> général, connecteurs séquentiels : <i>first, next, then, after this, once X has occurred, finally</i>.</td></tr>
        <tr><td class="en">Map (avant / après)</td><td>Transformations spatiales, <b>voix passive</b> : <i>was replaced by, was converted into, was demolished, was constructed, was widened, was extended</i>. Structurer <b>par zone géographique</b>.</td></tr>

/* Illustration associée à chaque question de méthodologie */
function artForMethod(m){
  const t = (m.q + " " + m.exp).toLowerCase();
  if(t.indexOf("percentage point")>-1 || t.indexOf("40 %")>-1) return ART.pp;
  if(t.indexOf("pie")>-1 || t.indexOf("camembert")>-1) return ART.pie;
  if(t.indexOf("table")>-1 || t.indexOf("tableau")>-1) return ART.table;
  if(t.indexOf("process")>-1) return ART.pSeq;
  if(t.indexOf("map")>-1) return ART.mReplace;
  if(t.indexOf("deux graphiques")>-1 || t.indexOf("multiples")>-1) return ART.multi;
  if(t.indexOf("bar chart")>-1 || t.indexOf("line graph")>-1) return ART.bars;
  if(m.topic==="timing") return ART.timing;
  if(m.topic==="selection") return ART.selection;
  if(m.topic==="grammar") return ART.grammar;
  if(m.topic==="example") return ART.goodBad;
  if(t.indexOf("overview")>-1) return ART.overview;
  if(t.indexOf("introduction")>-1) return ART.intro;
  return ART.structure;
}

const LS = "ielts-t1-v1";
let S = {
  srs:{},            /* id -> {w:poids, s:vues, c:correct, k:série correcte} */
  score:0, ans:0, ok:0, best:0, theme:"dark"
};
let streak = 0;

function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw){ const d = JSON.parse(raw); if(d && typeof d==="object") S = Object.assign(S, d); }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
}
function rec(id){
  if(!S.srs[id]) S.srs[id] = {w:1, s:0, c:0, k:0};
  return S.srs[id];
}
function mark(id, ok){
  const r = rec(id); r.s++;
  if(ok){ r.c++; r.k++; r.w = Math.max(0.2, r.w*0.55); }
  else  { r.k = 0;  r.w = Math.min(10, r.w*2.6 + 0.6); }
  S.ans++; if(ok) S.ok++;
  if(ok){ streak++; if(streak > S.best) S.best = streak; }
  else streak = 0;
  save(); renderStats();
}
function addScore(n){ S.score += n; save(); renderStats(); }
function mastered(id){ const r=S.srs[id]; return !!r && r.k>=3; }

const recent = [];
function pickWeighted(pool){
  if(!pool.length) return null;
  const avail = pool.filter(function(it){ return recent.indexOf(it.id)===-1; });
  const list = avail.length ? avail : pool;
  let tot = 0;
  const w = list.map(function(it){
    const r = S.srs[it.id];
    let x = r ? r.w : 1.15;          /* jamais vu = légèrement prioritaire */
    if(r && r.k>=3) x *= 0.35;        /* maîtrisé = plus rare, mais jamais nul */
    tot += x; return x;
  });
  let t = Math.random()*tot;
  let chosen = list[list.length-1];
  for(let i=0;i<list.length;i++){ t -= w[i]; if(t<=0){ chosen = list[i]; break; } }
  recent.push(chosen.id); if(recent.length>4) recent.shift();
  return chosen;
}
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=b[i]; b[i]=b[j]; b[j]=t; }
  return b;
}

function toast(msg){

}

function buildVocabQuestion(item){
  const enFirst = Math.random() < 0.5;
  const others = VOCAB.filter(function(x){
    return x.id!==item.id && (enFirst ? x.fr!==item.fr : x.en!==item.en);
  });
  const same = shuffle(others.filter(function(x){ return x.cat===item.cat; }));
  const diff = shuffle(others.filter(function(x){ return x.cat!==item.cat; }));
  const distract = same.concat(diff).slice(0,3);
  const opts = shuffle([item].concat(distract)).map(function(x){ return enFirst ? x.fr : x.en; });
  return {
    tag: CATS[item.cat].emoji+" "+CATS[item.cat].label,
    q: enFirst ? "Que signifie « "+item.en+" » ?" : "Comment dit-on « "+item.fr+" » ?",
    opts: opts,
    a: opts.indexOf(enFirst ? item.fr : item.en),
    exp: item.en+" = "+item.fr+"  ("+CATS[item.cat].label+")"
  };
}
function buildMethodQuestion(item){
  const order = shuffle(item.opts.map(function(t,i){ return {t:t,i:i}; }));
  return {
    tag:"📘 "+TOPICS[item.topic],
    q:item.q,
    opts:order.map(function(o){ return o.t; }),
    a:order.findIndex(function(o){ return o.i===item.a; }),
    exp:item.exp
  };
}
function quizPool(){
  if(qMode==="vocab") return VOCAB;
  if(qMode==="method") return METHOD;
  return ALL;
}

  qAnswered = false;
  qItem = pickWeighted(quizPool());

  const q = qItem.kind==="vocab" ? buildVocabQuestion(qItem) : buildMethodQuestion(qItem);
  qItem._q = q;
  $("qTag").textContent = q.tag;
  $("qText").textContent = q.q;

    b.className = "opt"; b.textContent = txt;

    box.appendChild(b);
  });
}
function quizArt(){
  const a = qItem.kind==="vocab" ? ART[qItem.art] : qItem.art;

function answerQuiz(i, btn){

            <td>Le mot <b>outweigh</b> impose de <b>trancher</b> : un paragraphe pour chaque côté, puis un verdict net. Sans « outweigh » (« What are the advantages and disadvantages? »), on expose simplement les deux.</td></tr>
        <tr><td class="en">What are the causes? What solutions can you suggest?<br><span class="muted">Problème &amp; solution</span></td>
            <td>Corps 1 = causes / problèmes, Corps 2 = solutions <b>appariées</b> à ces causes. Une solution qui ne répond à aucune cause citée est hors sujet.</td></tr>
        <tr><td class="en">Why …? What can be done …?<br><span class="muted">Two-part question</span></td>
            <td>Deux questions directes : <b>un paragraphe par question</b>. Oublier la seconde = réponse partielle, Task Response plafonné à 5.</td></tr>
      </table>
      <div class="box warn"><h4>Le réflexe qui sauve</h4>
        Avant d'écrire, soulignez le <b>verbe de la consigne</b> (agree / discuss / outweigh / suggest) et le <b>nombre de questions</b>. La structure en découle.
        « Is this a positive or negative development? » est une question d'<b>opinion</b> : il faut trancher.
      </div>
    </div>
  </details>

  <details class="acc"><summary>📏 3. Les 4 critères de notation (25 % chacun)</summary>
    <div class="accbody">
      <div id="memoCriteria"></div>
      <div class="crit">
        <div><b>TR — Task Response</b>Répondre à <b>toutes</b> les parties, position claire et constante, idées développées et pertinentes, exemples à l'appui.</div>
        <div><b>CC — Coherence &amp; Cohesion</b>Paragraphes logiques (une idée chacun), progression, connecteurs <b>variés et naturels</b>, référencement (<i>this trend, such measures, the latter</i>).</div>
        <div><b>LR — Lexical Resource</b>Vocabulaire précis et <b>collocations</b>, paraphrase de la consigne, peu de répétitions, orthographe et forme des mots correctes.</div>
        <div><b>GRA — Grammatical Range &amp; Accuracy</b><b>Variété</b> de structures (relatives, conditionnelles, participiales, passive) <b>et</b> exactitude : la majorité des phrases sans faute, ponctuation soignée.</div>
      </div>
      <div class="box good"><h4>Ce qui sépare un 6.5 d'un 8</h4>
        Pas des mots rares : une <b>position sans ambiguïté</b>, des idées <b>développées</b> (et non listées), des connecteurs qui ne sonnent pas mécaniques, et des phrases complexes <b>sans erreur</b>.
      </div>
    </div>
  </details>

  <details class="acc"><summary>🧩 4. Développer un paragraphe : la méthode PEEL</summary>
    <div class="accbody">
      <div id="memoPeel"></div>
      <ul>
        <li><b>P — Point</b> : la <i>topic sentence</i>, une seule idée, annoncée dès la première phrase.</li>
        <li><b>E — Explanation</b> : <b>pourquoi ?</b> le mécanisme, en deux ou trois phrases (<i>this is because…, which in turn…</i>).</li>
        <li><b>E — Example</b> : un exemple concret et plausible (pas besoin de statistique réelle).</li>
        <li><b>L — Link</b> : on relie explicitement l'idée à la question posée.</li>
      </ul>
      <div class="box warn"><h4>Pour ne jamais sécher</h4>
        Trois questions suffisent : <b>Pourquoi ?</b> → <b>Et alors, quelle conséquence ?</b> → <b>Un exemple ?</b><br>
        Et sept angles universels : économique, social, environnemental, santé, éducation, individu vs collectivité, court vs long terme.
      </div>
      <div class="box bad"><h4>Erreur classique</h4>
        Lister quatre idées survolées dans un paragraphe. <b>Une idée bien développée vaut mieux que quatre effleurées</b> : c'est exactement ce que mesure Task Response.
      </div>
    </div>
  </details>

  <details class="acc"><summary>🚫 5. Les erreurs qui plafonnent la note</summary>
    <div class="accbody">
      <ul>
        <li><b>Ne pas traiter toute la question</b> (une vue sur deux, une question sur deux) → TR plafonné à 5.</li>
        <li><b>Position floue ou changeante</b> → TR plafonné : décidez avant d'écrire.</li>
        <li><b>Phrases mémorisées</b> (« In this modern era, technology is everywhere… ») → ne comptent pas dans les mots et pénalisent.</li>
        <li><b>Connecteurs mécaniques</b> en rafale (<i>Firstly, Secondly, Moreover, In addition</i>) → CC pénalisé.</li>
        <li><b>Recopier les mots de la consigne</b> → aucun crédit en LR : paraphrasez.</li>
        <li><b>Moins de 250 mots</b> → pénalité automatique.</li>
        <li><b>Statistiques inventées</b> (« 87 % des gens… ») → préférez un exemple plausible et précis.</li>
        <li><b>Registre informel</b> : contractions (<i>don't</i>), <i>a lot of</i>, <i>stuff</i>, <i>kids</i>, points d'exclamation.</li>
        <li><b>Généralisations absolues</b> (<i>all, everyone, always</i>) → nuancez (<i>tend to, in most cases</i>).</li>
        <li><b>Un seul bloc</b> sans paragraphes → CC plafonné.</li>
        <li><b>Idée nouvelle en conclusion</b> → la conclusion synthétise, elle n'ajoute rien.</li>
      </ul>
    </div>
  </details>

  <details class="acc"><summary>🔤 6. Grammaire pour viser 8+</summary>
    <div class="accbody">
      <div id="memoGram"></div>
      <table>
        <tr><th>Structure</th><th>Exemple</th></tr>
        <tr><td class="en">Relative</td><td><i>Students <b>who</b> take a gap year often return more motivated.</i></td></tr>
        <tr><td class="en">Conditionnel type 2</td><td><i><b>If</b> governments <b>invested</b> more in public transport, fewer people <b>would</b> rely on cars.</i></td></tr>
        <tr><td class="en">Participiale</td><td><i><b>Faced with</b> rising costs, many families cut back on healthy food.</i></td></tr>
        <tr><td class="en">Inversion</td><td><i><b>Not only does</b> this reduce pollution, <b>but it also</b> improves public health.</i></td></tr>
        <tr><td class="en">Cleft sentence</td><td><i><b>What governments should do is</b> invest in prevention rather than punishment.</i></td></tr>
        <tr><td class="en">Passive</td><td><i>Stricter regulations <b>should be imposed</b> on manufacturers.</i></td></tr>
        <tr><td class="en">Nominalisation</td><td><i><b>The introduction of</b> stricter laws would…</i> (plus académique que <i>If laws were introduced…</i>)</td></tr>
      </table>
      <div class="box warn"><h4>Points de détail qui coûtent cher</h4>
        Virgule après un connecteur en tête de phrase (<i>However, …</i>) · indénombrables sans <i>-s</i> (<i>information, research, advice, knowledge</i>) · <i>people are</i>, jamais <i>people is</i> · pas de virgule avant <i>that</i>.
      </div>
    </div>
  </details>

  <details class="acc"><summary>✍️ 7. Essai modèle annoté (type opinion)</summary>
    <div class="accbody">
      <div class="prompt">Some people believe that unpaid community service should be a compulsory part of high school programmes. To what extent do you agree or disagree?</div>
      <div class="essay">
        <span class="lbl">Introduction</span>
        <p><i>It is increasingly argued that secondary school students should be required to carry out unpaid work for their local communities. I strongly agree with this view, as such schemes develop skills that classrooms cannot teach and strengthen social cohesion.</i></p>
        <div class="note">Phrase 1 = paraphrase de la consigne (<i>compulsory → required</i>, <i>community service → unpaid work for their local communities</i>). Phrase 2 = thèse + annonce des deux arguments. Aucune formule creuse.</div>

        <span class="lbl">Corps 1 — Point + Explanation + Example + Link</span>
        <p><i>The most compelling reason is that voluntary work equips young people with practical competences that academic study rarely provides. Organising a charity event, for instance, requires teenagers to manage a budget, negotiate with adults and meet deadlines — responsibilities that a written exam cannot replicate. A student who has spent a term helping at a food bank is therefore far better prepared for the demands of the workplace than one who has only studied theory.</i></p>
        <div class="note">Topic sentence claire → explication du mécanisme → exemple concret et plausible → retour explicite à la question. Une seule idée, développée.</div>

        <span class="lbl">Corps 2 — concession puis argument</span>
        <p><i>Admittedly, critics contend that compulsory schemes place an additional burden on students who are already under considerable academic pressure. However, this objection overlooks the social benefits involved. When young people from different backgrounds work side by side for a common purpose, prejudices tend to weaken and communities become more cohesive, which in turn reduces the sense of isolation that many teenagers report.</i></p>
        <div class="note">La concession (<i>Admittedly… However…</i>) montre une pensée nuancée et fait grimper TR et CC — à condition de la réfuter, pas de l'abandonner.</div>

        <span class="lbl">Conclusion</span>
        <p><i>In conclusion, although the demands on students are real, I firmly believe that compulsory community service should form part of the school curriculum, as it builds employable skills and fosters a stronger sense of collective responsibility.</i></p>
        <div class="note">Reformulation de la thèse + synthèse des deux arguments. Aucune idée nouvelle. ≈ 280 mots au total.</div>
      </div>
      <div class="box bad"><h4>❌ La même introduction, version faible</h4>
        <i>Nowadays, in this modern era, community service is a very important topic which is discussed by many people around the world. In this essay, I will discuss the advantages and disadvantages of this topic.</i>
        <p style="margin:8px 0 0">Formules mémorisées, aucune paraphrase, <b>aucune position</b> — et le plan annoncé (avantages / inconvénients) ne correspond même pas à la consigne, qui demande un avis.</p>
      </div>
    </div>
  </details>

  <details class="acc"><summary>🔍 8. Checklist de relecture (5 min)</summary>
    <div class="accbody">
      <ul>
        <li>Ai-je répondu à <b>toutes</b> les parties de la question ?</li>
        <li>Ma <b>position</b> est-elle explicite dans l'introduction <b>et</b> la conclusion, et identique ?</li>
        <li>Chaque paragraphe a-t-il une <b>topic sentence</b> et <b>un</b> exemple ?</li>
        <li>Au moins <b>250 mots</b> ? (comptez une ligne moyenne × le nombre de lignes)</li>
        <li>Accords sujet-verbe, <b>-s</b> aux verbes à la 3ᵉ personne, pluriels.</li>
        <li>Articles (<i>a / the</i>) et indénombrables sans <i>-s</i>.</li>
        <li>Aucune contraction, aucun mot familier.</li>
        <li>Les connecteurs sont-ils variés, ou est-ce <i>Firstly / Secondly / Moreover</i> en boucle ?</li>
        <li>Ai-je nuancé plutôt que généralisé (<i>tend to</i> plutôt que <i>always</i>) ?</li>
      </ul>
    </div>
  </details>

{en:"which in turn…", fr:"ce qui à son tour…", cat:"cause", art:"cause",
 tip:"Prolonge la <b>chaîne causale</b> : c’est ce qui transforme une idée listée en idée développée.",
 ex:["Better public transport reduces car use, which in turn lowers emissions.","De meilleurs transports publics réduisent l’usage de la voiture, ce qui à son tour abaisse les émissions."],
 ex2:["Unemployment breeds poverty, which in turn fuels crime.","Le chômage engendre la pauvreté, ce qui à son tour alimente la délinquance."],
 ko:["Better transport reduces car use. In turn lowers emissions.","Phrase sans sujet : gardez la relative — …, which in turn lowers emissions."]},
{en:"the knock-on effect is that…", fr:"l’effet d’entraînement est que…", cat:"cause", art:"cause",
 tip:"Nomme une conséquence <b>indirecte</b> : parfait pour montrer une réflexion en profondeur.",
 ex:["Wages stagnate, and the knock-on effect is that consumer spending falls.","Les salaires stagnent, et l’effet d’entraînement est que la consommation recule."],
 ex2:["The knock-on effects on rural communities are considerable.","Les répercussions sur les communautés rurales sont considérables."],
 ko:["The knock-on effect is falling.","Formulation incomplète : the knock-on effect is that + proposition."]},

/* — EXEMPLES — */
{en:"for instance / for example", fr:"par exemple", cat:"example", art:"example",
 tip:"Le <b>E</b> de PEEL. Un exemple <b>par paragraphe</b> suffit, mais il doit être concret.",
 ex:["Many employers now offer flexible hours; Microsoft Japan, for instance, trialled a four-day week.","De nombreux employeurs proposent des horaires souples ; Microsoft Japon, par exemple, a testé la semaine de quatre jours."],
 ex2:["For instance, a student who volunteers at a food bank learns to work with adults.","Par exemple, un élève bénévole dans une banque alimentaire apprend à travailler avec des adultes."],
 ko:["For example, it is very useful for everybody.","Ce n’est pas un exemple mais une répétition de l’idée : il faut un cas concret."]},
{en:"a case in point is…", fr:"un exemple révélateur est…", cat:"example", art:"example",
 tip:"Introduit un exemple <b>particulièrement parlant</b> — varie de « for example », répété par tous.",
 ex:["A case in point is Finland, where teacher training is highly selective.","Un exemple révélateur est la Finlande, où la formation des enseignants est très sélective."],
 ex2:["A clear illustration of this is the rapid growth of online learning platforms.","Une illustration nette en est la croissance rapide des plateformes d’apprentissage en ligne."],
 ko:["A case in point is that it is useful.","« a case in point » annonce un cas précis, pas une opinion générale."]},
{en:"to illustrate this…", fr:"pour illustrer cela…", cat:"example", art:"example",
 tip:"Relie explicitement l’exemple à l’explication qui précède.",
 ex:["To illustrate this, consider a teenager organising a charity event.","Pour illustrer cela, prenons le cas d’un adolescent organisant un événement caritatif."],
 ex2:["This can be illustrated by the decline of local high-street shops.","Cela peut être illustré par le déclin des commerces de centre-ville."],
 ko:["To illustrate this, I will give an example later.","Annonce sans contenu : l’exemple doit suivre immédiatement."]},
{en:"take X as an example", fr:"prenons X comme exemple", cat:"example", art:"example",
 tip:"Formulation <b>directe</b> et naturelle, à utiliser une seule fois dans l’essai.",
 ex:["Take Singapore as an example: strict regulation has produced remarkably clean streets.","Prenons Singapour comme exemple : une réglementation stricte a produit des rues remarquablement propres."],
 ex2:["Take the case of rural clinics, which often lack qualified staff.","Prenons le cas des dispensaires ruraux, qui manquent souvent de personnel qualifié."],
 ko:["Take for example my country is very good at this.","Deux structures mélangées : « Take my country as an example: … »"]},
{en:"as evidenced by…", fr:"comme en témoigne…", cat:"example", art:"example",
 tip:"Registre <b>très académique</b>, suivi d’un nom : idéal pour appuyer sans inventer de chiffre.",
 ex:["Public attitudes are shifting, as evidenced by the growing demand for electric vehicles.","Les mentalités évoluent, comme en témoigne la demande croissante de véhicules électriques."],
 ex2:["The policy has had an effect, as evidenced by falling accident rates.","La politique a eu un effet, comme en témoigne la baisse du nombre d’accidents."],
 ko:["As evidenced by people like it very much.","Après « as evidenced by » : un groupe nominal, pas une proposition."]},
/* — CONCESSION / CONTRASTE — */
{en:"although / even though", fr:"bien que / même si", cat:"contrast", art:"contrast",
 tip:"Subordonnée de concession : suivie d’une <b>proposition complète</b> (sujet + verbe).",
 ex:["Although the policy is expensive, its long-term savings are considerable.","Bien que cette politique soit coûteuse, les économies à long terme sont considérables."],
 ex2:["Even though critics dismiss the idea, several countries have adopted it successfully.","Même si les détracteurs rejettent l’idée, plusieurs pays l’ont adoptée avec succès."],
 ko:["Although the policy is expensive, but its savings are considerable.","On n’emploie jamais « although » et « but » dans la même phrase : l’un ou l’autre."]},
{en:"despite / in spite of + nom", fr:"malgré", cat:"contrast", art:"contrast",
 tip:"Suivi d’un <b>nom</b> ou d’un <b>V-ing</b> — jamais d’une proposition avec un verbe conjugué.",
 ex:["Despite its cost, the scheme has proved remarkably effective.","Malgré son coût, le dispositif s’est révélé remarquablement efficace."],
 ex2:["In spite of receiving little funding, the project succeeded.","Bien qu’ayant reçu peu de financements, le projet a réussi."],
 ko:["Despite the scheme is expensive, it works well.","Despite + nom / V-ing. Avec une proposition, utilisez « although »."]},
{en:"however / nevertheless", fr:"cependant / néanmoins", cat:"contrast", art:"connect",
 tip:"Connecteur de <b>phrase</b> : virgule après lui, et point ou point-virgule avant.",
 ex:["The plan is ambitious. However, it lacks a credible source of funding.","Le plan est ambitieux. Cependant, il manque d’une source de financement crédible."],
 ex2:["Nevertheless, the underlying trend remains positive.","Néanmoins, la tendance de fond reste positive."],
 ko:["The plan is ambitious, however it lacks funding.","Virgule fautive : utilisez un point ou un point-virgule avant « however », puis une virgule."]},
{en:"on the other hand", fr:"d’un autre côté", cat:"contrast", art:"tDiscussion",
 tip:"Introduit la <b>seconde vue</b> — n’a de sens que si une première vue a réellement été exposée.",
 ex:["On the other hand, opponents warn that such schemes are difficult to enforce.","D’un autre côté, les opposants alertent sur la difficulté à faire appliquer de tels dispositifs."],
 ex2:["Supporters stress the savings; on the other hand, critics highlight the social cost.","Les partisans insistent sur les économies ; d’un autre côté, les détracteurs soulignent le coût social."],
 ko:["On the other hand, I will now give my second argument.","« On the other hand » annonce un contraste, pas la suite de votre propre raisonnement."]},
{en:"admittedly…, yet…", fr:"certes…, pourtant…", cat:"contrast", art:"contrast",
 tip:"La <b>concession</b> : reconnaître l’objection puis la réfuter. Une des marques du band 8.",
 ex:["Admittedly, such measures are costly; yet the alternative is far more expensive.","Certes, de telles mesures sont coûteuses ; pourtant l’alternative l’est bien davantage."],
 ex2:["Admittedly, this argument has some merit, but it overlooks long-term consequences.","Certes, cet argument a une part de vérité, mais il néglige les conséquences à long terme."],
 ko:["Admittedly, such measures are costly.","Concession laissée sans réponse : votre propre position s’en trouve affaiblie."]},
{en:"critics argue that…", fr:"les détracteurs soutiennent que…", cat:"contrast", art:"contrast",
 tip:"Expose une <b>objection</b> que vous allez réfuter : structure attendue dans un essai d’opinion abouti.",
 ex:["Critics argue that compulsory schemes add pressure to already overworked students.","Les détracteurs soutiennent que les dispositifs obligatoires accroissent la pression sur des élèves déjà surchargés."],
 ex2:["Opponents of this measure contend that it penalises the poorest households.","Les opposants à cette mesure affirment qu’elle pénalise les ménages les plus modestes."],
 ko:["Some people are against it because they don’t like it.","Registre oral et argument vide : formulez l’objection sérieusement."]},
{en:"while it is true that…, it must be remembered that…", fr:"s’il est vrai que…, il faut se rappeler que…", cat:"contrast", art:"contrast",
 tip:"Charnière complète : la concession et la réfutation <b>dans la même phrase</b>.",
 ex:["While it is true that fees deter some visitors, it must be remembered that museums need funding.","S’il est vrai que les droits d’entrée dissuadent certains visiteurs, il faut se rappeler que les musées ont besoin de financements."],
 ex2:["While this concern is legitimate, it applies to a small minority of cases.","Si cette inquiétude est légitime, elle ne concerne qu’une faible minorité de cas."],
 ko:["It is true that fees deter visitors. Museums need money too.","Deux phrases juxtaposées : le lien logique n’est pas marqué, la cohésion en pâtit."]},

/* — AJOUTER — */
{en:"furthermore / moreover", fr:"de plus / en outre", cat:"add", art:"add",
 tip:"Ajoute un argument. <b>Une seule fois par essai</b> : leur répétition est jugée mécanique.",
 ex:["Furthermore, such programmes create valuable links between schools and local businesses.","De plus, ces programmes créent des liens précieux entre les écoles et les entreprises locales."],
 ex2:["Moreover, the environmental benefits extend well beyond city limits.","En outre, les bénéfices environnementaux dépassent largement les limites de la ville."],
 ko:["Moreover, furthermore, in addition, also, besides…","Empilement de connecteurs synonymes : la cohésion devient artificielle."]},
{en:"not only … but also …", fr:"non seulement… mais aussi…", cat:"add", art:"grammar",
 tip:"En tête de phrase, elle impose l’<b>inversion</b> : <i>Not only does it…, but it also…</i> — très valorisé en GRA.",
 ex:["Not only does cycling reduce pollution, but it also improves public health.","Non seulement le vélo réduit la pollution, mais il améliore aussi la santé publique."],
 ex2:["The scheme benefits not only students but also the wider community.","Le dispositif profite non seulement aux élèves mais aussi à l’ensemble de la collectivité."],
 ko:["Not only cycling reduces pollution, but also it improves health.","Inversion oubliée : Not only DOES cycling reduce…, but it ALSO improves…"]},
{en:"what is more", fr:"qui plus est", cat:"add", art:"add",
 tip:"Variante plus naturelle que « moreover », utile pour éviter la répétition.",
 ex:["What is more, the initiative costs almost nothing to implement.","Qui plus est, l’initiative ne coûte presque rien à mettre en œuvre."],
 ex2:["What is more important, however, is the effect on children’s wellbeing.","Ce qui importe davantage, cependant, c’est l’effet sur le bien-être des enfants."],
 ko:["What is more, what is more important, and also more…","Répétition maladroite : une seule occurrence suffit."]},
{en:"coupled with", fr:"conjugué à", cat:"add", art:"add",
 tip:"Combine <b>deux facteurs</b> en une seule structure nominale : compact et académique.",
 ex:["Rising rents, coupled with stagnant wages, have pushed families out of city centres.","La hausse des loyers, conjuguée à la stagnation des salaires, a chassé les familles des centres-villes."],
 ex2:["Poor diet coupled with inactivity explains much of the increase.","Une mauvaise alimentation conjuguée à la sédentarité explique une large part de la hausse."],
 ko:["Rising rents coupled with wages are stagnant.","« coupled with » se construit avec un nom, pas une proposition."]},

/* — PROBLÈMES — */
{en:"a root cause of… is", fr:"une cause profonde de… est", cat:"problem", art:"problem",
 tip:"Distingue la cause <b>profonde</b> des symptômes : exactement ce qu’attend un sujet « causes ».",
 ex:["A root cause of urban congestion is the lack of reliable public transport.","Une cause profonde de la congestion urbaine est le manque de transports publics fiables."],
 ex2:["The root of the problem lies in unequal access to education.","La racine du problème réside dans l’inégalité d’accès à l’éducation."],
 ko:["The cause is that there are many cars.","Symptôme, pas cause : demandez-vous pourquoi il y a autant de voitures."]},
{en:"a major contributing factor", fr:"un facteur aggravant majeur", cat:"problem", art:"problem",
 tip:"Permet de citer <b>plusieurs causes</b> sans prétendre qu’une seule explique tout.",
 ex:["A major contributing factor is the widespread availability of cheap processed food.","Un facteur aggravant majeur est la disponibilité massive de produits transformés bon marché."],
 ex2:["Another contributing factor is the decline of physical education in schools.","Un autre facteur aggravant est le recul de l’éducation physique à l’école."],
 ko:["The only reason is processed food.","Cause unique : peu crédible et facile à contredire."]},
{en:"exacerbate / aggravate", fr:"aggraver", cat:"problem", art:"problem",
 tip:"Signale qu’un problème <b>existant</b> empire : plus précis que « make worse ».",
 ex:["Cutting bus routes would only exacerbate rural isolation.","Supprimer des lignes de bus ne ferait qu’aggraver l’isolement rural."],
 ex2:["The shortage of housing has been aggravated by speculation.","La pénurie de logements a été aggravée par la spéculation."],
 ko:["This makes the problem more bad.","Erreur de comparatif et registre pauvre : exacerbates the problem."]},
{en:"pose a serious threat to", fr:"représenter une grave menace pour", cat:"problem", art:"problem",
 tip:"Collocation <b>fixe</b> : on « pose » une menace, on ne la « fait » pas.",
 ex:["Rising sea levels pose a serious threat to coastal communities.","La montée des eaux représente une grave menace pour les communautés côtières."],
 ex2:["Misinformation poses a genuine threat to democratic debate.","La désinformation représente une véritable menace pour le débat démocratique."],
 ko:["Rising sea levels make a big threat to coastal cities.","Collocation fautive : on dit « pose a threat », jamais « make a threat » dans ce sens."]},
{en:"have a detrimental effect on", fr:"avoir un effet néfaste sur", cat:"problem", art:"problem",
 tip:"Collocation académique. Attention : <b>effect</b> est le nom, <b>affect</b> le verbe.",
 ex:["Excessive screen time has a detrimental effect on children’s sleep.","Un temps d’écran excessif a un effet néfaste sur le sommeil des enfants."],
 ex2:["Noise pollution adversely affects concentration and wellbeing.","La pollution sonore nuit à la concentration et au bien-être."],
 ko:["Screen time has a detrimental affect on sleep.","Confusion classique : le nom s’écrit effect, le verbe affect."]},
{en:"adverse consequences", fr:"conséquences néfastes", cat:"problem", art:"problem",
 tip:"Groupe nominal utile pour <b>nominaliser</b> et élever le registre.",
 ex:["The policy had a number of adverse consequences for small businesses.","La politique a eu plusieurs conséquences néfastes pour les petites entreprises."],
 ex2:["These measures carry few adverse consequences for ordinary households.","Ces mesures comportent peu de conséquences néfastes pour les ménages ordinaires."],
 ko:["The policy had many bad things for business.","Registre trop pauvre : adverse consequences / negative repercussions."]},

/* — SOLUTIONS — */
{en:"governments should implement…", fr:"les gouvernements devraient mettre en place…", cat:"solution", art:"solution",
 tip:"Désignez toujours <b>qui</b> agit (gouvernements, écoles, employeurs) : une solution sans acteur ne vaut rien.",
 ex:["Governments should implement subsidies for households installing solar panels.","Les gouvernements devraient mettre en place des aides pour les ménages installant des panneaux solaires."],
 ex2:["Schools should introduce compulsory financial literacy classes.","Les écoles devraient instaurer des cours obligatoires de gestion financière."],
 ko:["Something should be done about this problem.","Solution vide : ni acteur, ni mesure, ni mécanisme."]},
{en:"a viable solution would be to…", fr:"une solution viable consisterait à…", cat:"solution", art:"solution",
 tip:"Le conditionnel montre que la mesure est <b>proposée</b>, pas déjà appliquée.",
 ex:["A viable solution would be to invest in a nationwide network of cycle lanes.","Une solution viable consisterait à investir dans un réseau national de pistes cyclables."],
 ex2:["One practical remedy would be to extend opening hours in public clinics.","Un remède concret consisterait à élargir les horaires des dispensaires publics."],
 ko:["A viable solution would be investing money on this problem.","Structure et préposition fautives : would be to invest in…"]},
{en:"measures should be taken to…", fr:"des mesures devraient être prises pour…", cat:"solution", art:"solution",
 tip:"Tournure <b>passive</b> : élégante, mais précisez ensuite par qui, sinon la solution reste floue.",
 ex:["Measures should be taken to limit advertising aimed at young children.","Des mesures devraient être prises pour limiter la publicité destinée aux jeunes enfants."],
 ex2:["Urgent steps must be taken to reduce emissions from heavy industry.","Des mesures urgentes doivent être prises pour réduire les émissions de l’industrie lourde."],
 ko:["Measures should be taken for reduce emissions.","Après « to », un infinitif : to reduce, jamais « for reduce »."]},
{en:"impose stricter regulations on", fr:"imposer une réglementation plus stricte à", cat:"solution", art:"solution",
 tip:"Collocation clé des sujets environnement, santé et criminalité.",
 ex:["Authorities could impose stricter regulations on single-use plastics.","Les autorités pourraient imposer une réglementation plus stricte aux plastiques à usage unique."],
 ex2:["Tighter restrictions on junk-food advertising would protect children.","Des restrictions plus strictes sur la publicité pour la malbouffe protégeraient les enfants."],
 ko:["The government should do stricter rules for plastic.","« do rules » n’existe pas : impose / introduce / tighten regulations."]},
{en:"raise public awareness of", fr:"sensibiliser le public à", cat:"solution", art:"solution",
 tip:"Solution <b>non coercitive</b>, à associer à une mesure concrète pour ne pas rester vague.",
 ex:["Campaigns could raise public awareness of the risks of a sedentary lifestyle.","Des campagnes pourraient sensibiliser le public aux risques de la sédentarité."],
 ex2:["Awareness campaigns alone rarely change behaviour; they must be paired with incentives.","Les campagnes de sensibilisation changent rarement les comportements à elles seules : il faut les coupler à des incitations."],
 ko:["The government should tell people that it is bad.","Registre enfantin : raise awareness of the health risks."]},
{en:"invest heavily in / subsidise", fr:"investir massivement dans / subventionner", cat:"solution", art:"solution",
 tip:"Verbes de <b>politique publique</b>. Pensez à indiquer la source du financement si vous en avez la place.",
 ex:["Governments should invest heavily in vocational training for school leavers.","Les gouvernements devraient investir massivement dans la formation professionnelle des sortants du système scolaire."],
 ex2:["Subsidising public transport would make it a realistic alternative to driving.","Subventionner les transports publics en ferait une alternative réaliste à la voiture."],
 ko:["Governments should invest in a lot of money.","Erreur de structure : invest heavily in training / invest a lot of money in training."]},
{en:"incentivise people to…", fr:"inciter les gens à…", cat:"solution", art:"solution",
 tip:"Alternative <b>positive</b> à l’interdiction : montre une pensée nuancée sur les politiques publiques.",
 ex:["Tax breaks could incentivise companies to reduce their carbon footprint.","Des allègements fiscaux pourraient inciter les entreprises à réduire leur empreinte carbone."],
 ex2:["Financial incentives encourage households to insulate their homes.","Les incitations financières encouragent les ménages à isoler leur logement."],
 ko:["The government should force everybody to do it.","Solution unique et coercitive : l’incitation est souvent plus défendable."]},

/* — CONCLUSION — */
{en:"in conclusion / to conclude", fr:"en conclusion / pour conclure", cat:"conclude", art:"conclude",
 tip:"Ouvre la conclusion. Elle <b>reformule la thèse</b> et synthétise : <b>aucune idée nouvelle</b>.",
 ex:["In conclusion, compulsory community service equips students with skills that classrooms cannot provide.","En conclusion, le service civique obligatoire dote les élèves de compétences que la salle de classe ne peut offrir."],
 ex2:["To conclude, the benefits of this policy clearly justify its cost.","Pour conclure, les bénéfices de cette politique en justifient clairement le coût."],
 ko:["In conclusion, another important point is that schools need more money.","Idée nouvelle en conclusion : elle n’est pas développée, donc elle affaiblit l’essai."]},
{en:"having considered both views…", fr:"après avoir examiné les deux points de vue…", cat:"conclude", art:"tDiscussion",
 tip:"Structure <b>participiale</b> parfaite pour conclure une discussion : forme valorisée en GRA.",
 ex:["Having considered both views, I remain convinced that prevention deserves priority.","Après avoir examiné les deux points de vue, je reste convaincu que la prévention doit être prioritaire."],
 ex2:["Having weighed the evidence, this essay sides with the second position.","Après avoir pesé les arguments, cet essai se range à la seconde position."],
 ko:["After I considered both views, so I think the second is better.","Structure lourde et fautive : Having considered both views, I believe…"]},
{en:"on balance", fr:"tout bien pesé", cat:"conclude", art:"conclude",
 tip:"Indique un jugement <b>après pesée</b> des deux côtés : idéal pour les sujets « outweigh ».",
 ex:["On balance, the advantages of remote work outweigh its disadvantages.","Tout bien pesé, les avantages du télétravail l’emportent sur ses inconvénients."],
 ex2:["On balance, the evidence favours prevention over punishment.","Tout bien pesé, les arguments penchent pour la prévention plutôt que la sanction."],
 ko:["On balance, both sides are equally good.","Refus de trancher : la question demandait un verdict."]},
{en:"weighing up both arguments…", fr:"en pesant les deux arguments…", cat:"conclude", art:"tAdv",
 tip:"Variante de « on balance », avec un <b>participe présent</b> en tête de phrase.",
 ex:["Weighing up both arguments, the case for stricter regulation appears stronger.","En pesant les deux arguments, la thèse d’une réglementation plus stricte paraît plus solide."],
 ex2:["Weighing the costs against the benefits, the policy remains justified.","En pesant les coûts et les bénéfices, la politique reste justifiée."],
 ko:["Weighing up both arguments, it is difficult to say.","Conclusion sans position : Task Response en souffre directement."]},
{en:"…should therefore be prioritised", fr:"…devrait donc être une priorité", cat:"conclude", art:"conclude",
 tip:"Clôt sur une <b>recommandation</b> forte, cohérente avec la thèse annoncée en introduction.",
 ex:["Investment in early education should therefore be prioritised over short-term measures.","L’investissement dans l’éducation précoce devrait donc primer sur les mesures de court terme."],
 ex2:["Prevention should therefore take precedence over punishment.","La prévention devrait donc primer sur la sanction."],
 ko:["So, education is priority for everybody in the world.","Registre et généralisation : restez dans le cadre posé par la consigne."]},

/* — COLLOCATIONS THÉMATIQUES — */
{en:"narrow the gap between rich and poor", fr:"réduire l’écart entre riches et pauvres", cat:"topic", art:"topic",
 tip:"Sujets <b>société / inégalités</b>. Le verbe attendu est narrow ou bridge, pas « reduce the difference ».",
 ex:["Progressive taxation is one of the few tools able to narrow the gap between rich and poor.","L’impôt progressif est l’un des rares outils capables de réduire l’écart entre riches et pauvres."],
 ex2:["Free school meals help bridge the gap between advantaged and disadvantaged pupils.","Les repas scolaires gratuits contribuent à combler l’écart entre élèves favorisés et défavorisés."],
 ko:["Taxes can make the difference between rich and poor smaller.","Correct mais pauvre : c’est exactement ce que mesure Lexical Resource."]},
{en:"curb greenhouse gas emissions", fr:"limiter les émissions de gaz à effet de serre", cat:"topic", art:"topic",
 tip:"Sujets <b>environnement</b>. <i>curb</i> = freiner, contenir : plus précis que « reduce ».",
 ex:["Only coordinated international action can curb greenhouse gas emissions effectively.","Seule une action internationale coordonnée peut limiter efficacement les émissions de gaz à effet de serre."],
 ex2:["Carbon pricing is designed to curb industrial emissions at their source.","La tarification du carbone vise à limiter les émissions industrielles à la source."],
 ko:["We must stop the greenhouse gas.","Registre oral et imprécis : curb / cut / reduce greenhouse gas emissions."]},
{en:"place a strain on public healthcare", fr:"peser sur le système de santé public", cat:"topic", art:"topic",
 tip:"Sujets <b>santé / vieillissement</b>. Collocation fixe : on « place a strain on » un système.",
 ex:["An ageing population places a considerable strain on public healthcare.","Le vieillissement de la population pèse considérablement sur le système de santé public."],
 ex2:["Preventable illnesses place an avoidable burden on hospitals.","Les maladies évitables font peser une charge inutile sur les hôpitaux."],
 ko:["Old people give a lot of problems to hospitals.","Registre inapproprié : place a strain on / put pressure on healthcare services."]},
{en:"equip students with practical skills", fr:"doter les élèves de compétences pratiques", cat:"topic", art:"topic",
 tip:"Sujets <b>éducation</b>. Structure : equip somebody <b>with</b> something.",
 ex:["Vocational courses equip students with practical skills that employers value.","Les filières professionnelles dotent les élèves de compétences pratiques appréciées des employeurs."],
 ex2:["Schools should equip young people with the skills to manage their finances.","L’école devrait doter les jeunes des compétences nécessaires pour gérer leur budget."],
 ko:["Schools should give to students practical skills.","Ordre des mots fautif : give students practical skills / equip students with skills."]},
{en:"achieve a healthy work-life balance", fr:"trouver un bon équilibre vie professionnelle / vie privée", cat:"topic", art:"topic",
 tip:"Sujets <b>travail</b>. Collocation figée : achieve / maintain / strike a work-life balance.",
 ex:["Flexible hours make it easier for parents to achieve a healthy work-life balance.","Les horaires souples permettent aux parents de mieux concilier vie professionnelle et vie privée."],
 ex2:["Remote work can blur, rather than improve, the work-life balance.","Le télétravail peut brouiller l’équilibre vie pro / vie privée plutôt que l’améliorer."],
 ko:["People want to have a good balance between the work and the life.","Lourd : achieve a healthy work-life balance."]},
{en:"act as a deterrent to crime", fr:"avoir un effet dissuasif sur la criminalité", cat:"topic", art:"topic",
 tip:"Sujets <b>criminalité / justice</b>. <i>deterrent</i> est un nom : act as a deterrent <b>to</b>.",
 ex:["Longer sentences are widely assumed to act as a deterrent to crime.","On suppose largement que des peines plus longues ont un effet dissuasif sur la criminalité."],
 ex2:["Visible policing acts as a more immediate deterrent than harsher penalties.","Une police visible dissuade plus immédiatement que des peines plus lourdes."],
 ko:["Prison makes people scared so they don’t do crimes.","Registre trop familier et formulation fautive : « commit crimes », « act as a deterrent »."]},

/* Illustration associée à chaque question de méthodologie */
function artForMethod(m){
  const t = (m.q + " " + m.exp).toLowerCase();
  if(t.indexOf("outweigh")>-1 || t.indexOf("avantages")>-1) return ART.tAdv;
  if(t.indexOf("discuss both")>-1 || t.indexOf("deux vues")>-1 || t.indexOf("both views")>-1) return ART.tDiscussion;
  if(t.indexOf("two-part")>-1 || t.indexOf("deux questions")>-1) return ART.tTwoPart;
  if(t.indexOf("causes")>-1 || t.indexOf("solution")>-1) return ART.tProblem;
  if(t.indexOf("agree")>-1 || t.indexOf("positive ou")>-1 || t.indexOf("opinion")>-1) return ART.tOpinion;
  if(t.indexOf("peel")>-1 || t.indexOf("paragraphe de corps")>-1 || t.indexOf("idée")>-1) return ART.peel;
  if(t.indexOf("conclusion")>-1) return ART.conclude;
  if(t.indexOf("introduction")>-1 || t.indexOf("paraphras")>-1) return ART.intro;
  if(t.indexOf("mots")>-1) return ART.words;
  if(m.topic==="timing") return ART.timing;
  if(m.topic==="criteria") return ART.criteria;
  if(m.topic==="grammar") return ART.grammar;
  if(m.topic==="errors") return ART.errors;
  if(m.topic==="ideas") return ART.peel;
  return ART.structure;
}
METHOD.forEach(function(m){ m.art = artForMethod(m); });

const LS = "ielts-t2-v1";
let S = { srs:{}, score:0, ans:0, ok:0, best:0, theme:"dark" };
let streak = 0;

function load(){
  try{ const raw = localStorage.getItem(LS);
    if(raw){ const d = JSON.parse(raw); if(d && typeof d==="object") S = Object.assign(S, d); }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function rec(id){ if(!S.srs[id]) S.srs[id] = {w:1, s:0, c:0, k:0}; return S.srs[id]; }
function mark(id, ok){
  const r = rec(id); r.s++;
  if(ok){ r.c++; r.k++; r.w = Math.max(0.2, r.w*0.55); }
  else  { r.k = 0;  r.w = Math.min(10, r.w*2.6 + 0.6); }
  S.ans++; if(ok) S.ok++;
  if(ok){ streak++; if(streak > S.best) S.best = streak; } else streak = 0;
  save(); renderStats();
}
function addScore(n){ S.score += n; save(); renderStats(); }
function mastered(id){ const r=S.srs[id]; return !!r && r.k>=3; }

const recent = [];
function pickWeighted(pool){
  if(!pool.length) return null;
  const avail = pool.filter(function(it){ return recent.indexOf(it.id)===-1; });
  const list = avail.length ? avail : pool;
  let tot = 0;
  const w = list.map(function(it){
    const r = S.srs[it.id];
    let x = r ? r.w : 1.15;
    if(r && r.k>=3) x *= 0.35;
    tot += x; return x;
  });
  let t = Math.random()*tot;
  let chosen = list[list.length-1];
  for(let i=0;i<list.length;i++){ t -= w[i]; if(t<=0){ chosen = list[i]; break; } }
  recent.push(chosen.id); if(recent.length>4) recent.shift();
  return chosen;
}
function shuffle(a){
  const b = a.slice();
  for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=b[i]; b[i]=b[j]; b[j]=t; }
  return b;
}

/* ============================================================

let qMode = "all", qItem = null, qAnswered = false;

function buildVocabQuestion(item){
  const enFirst = Math.random() < 0.5;

    return x.id!==item.id && (enFirst ? x.fr!==item.fr : x.en!==item.en);

  const same = shuffle(others.filter(function(x){ return x.cat===item.cat; }));
  const diff = shuffle(others.filter(function(x){ return x.cat!==item.cat; }));
  const distract = same.concat(diff).slice(0,3);
  const opts = shuffle([item].concat(distract)).map(function(x){ return enFirst ? x.fr : x.en; });
  return {
    tag: CATS[item.cat].emoji+" "+CATS[item.cat].label,
    q: enFirst ? "Que signifie « "+item.en+" » ?" : "Comment dit-on « "+item.fr+" » ?",
    opts: opts, a: opts.indexOf(enFirst ? item.fr : item.en),

  return { tag:"📘 "+TOPICS[item.topic], q:item.q, opts:order.map(function(o){ return o.t; }),
           a:order.findIndex(function(o){ return o.i===item.a; }), exp:item.exp };

  $("qTag").textContent = q.tag;

  q.opts.forEach(function(txt, i){

    b.className = "opt"; b.textContent = txt;

}
function answerQuiz(i, btn){

  }else{
    fb.innerHTML = "<b>❌ Réponse : "+q.opts[q.a]+"</b><br>"+q.exp+quizArt()
      +"<span class=\\"muted\\">Cette notion reviendra vite.</span>";
  }

}

                     : "<b>❌ Type attendu : "+TYPES[tItem.type].label+"</b><br>")

/* ============================================================
   MODE 4 — CLASSEMENT RAPIDE
   ============================================================ */
let sortItem = null, sortAnswered = false, sortLimit = 10, timerId = null, tLeft = 0;
document.querySelectorAll("[data-sm]").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll("[data-sm]").forEach(function(x){ x.classList.remove("on"); });
    b.classList.add("on"); sortLimit = parseInt(b.dataset.sm,10); nextSort();
  });
});
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId = null; } }
function startTimer(){
  stopTimer();
  const bar = $("sortTimer");
  if(!sortLimit){ bar.style.width = "100%"; bar.style.opacity = ".25"; return; }
  bar.style.opacity = "1";
  tLeft = sortLimit*1000; bar.style.width = "100%";
  const step = 100;
  timerId = setInterval(function(){
    tLeft -= step;
    bar.style.width = Math.max(0, tLeft/(sortLimit*1000)*100)+"%";
    if(tLeft<=0){ stopTimer(); if(!sortAnswered) answerSort(null, null); }
  }, step);
}
function sortArt(){

function nextSort(){

  const opts = shuffle([sortItem.cat].concat(wrong));

  opts.forEach(function(k){

function renderProgress(){
  $("gScore").textContent = S.score;
  $("gAns").textContent = S.ans;

  $("gBar").style.width = (ALL.length ? m/ALL.length*100 : 0)+"%";

  let html = "";
  function group(label, items){
    const done = items.filter(function(it){ return mastered(it.id); }).length;
    const pct = items.length ? Math.round(done/items.length*100) : 0;
    html += '<div class="pitem"><span>'+label+'</span><span class="muted">'+done+"/"+items.length+"</span>"
         + '<div class="bar"><i style="width:'+pct+'%"></i></div></div>';

.bigterm{font-size:24px;font-weight:800;text-align:center;padding:18px 6px;line-height:1.3}

/* Mémo */
.acc{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px;background:var(--card)}
.acc>summary{cursor:pointer;padding:14px 16px;font-weight:700;font-size:15px;list-style:none;display:flex;gap:10px;align-items:center}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"+";margin-left:auto;color:var(--muted);font-size:20px}
.acc[open]>summary::after{content:"–"}
.accbody{padding:0 16px 16px;font-size:14.5px}
.accbody ul{padding-left:20px;margin:8px 0}
.accbody li{margin:5px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td.en{font-weight:700}
.box{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:14px;border-left:4px solid}
.box.bad{background:rgba(251,113,133,.10);border-color:var(--bad)}
.box.good{background:rgba(52,211,153,.10);border-color:var(--good)}
.box.warn{background:rgba(251,191,36,.10);border-color:var(--warn)}
.box h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
kbd{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}

/* Progrès */
.bar{height:9px;background:var(--card2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.plist{display:grid;gap:10px;margin-top:10px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:13.5px}
.pitem .bar{grid-column:1/3}
.revlist{display:grid;gap:8px;margin-top:10px}
.revitem{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06202b;font-weight:800;padding:10px 18px;
  border-radius:999px;font-size:14px;pointer-events:none;transition:.3s;z-index:50;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:22px 0 10px}
.center{text-align:center}
.sp{height:10px}

/* — spécifique examens — */
#examSel{flex:1 1 100%;max-width:100%;min-width:0}
select{max-width:100%}
.hrow .navswitch{flex:1 1 100%;justify-content:center;margin-top:2px;order:3}
.hrow .iconbtn{order:2}
.hrow .logo{flex:1 1 60%;min-width:0}
.navswitch{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px}
.navswitch a{font-size:11.5px;font-weight:700;color:var(--muted);text-decoration:none;border-radius:999px;
  padding:6px 11px;white-space:nowrap}
.navswitch a.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06202b}
.timerbox{position:sticky;top:0;z-index:15;background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 0;margin-bottom:14px}
.clock{font-size:34px;font-weight:800;letter-spacing:1px;text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--warn)} .clock.over{color:var(--bad)}
.clocklbl{text-align:center;font-size:11.5px;color:var(--muted);margin-top:4px}
.tprog{height:6px;border-radius:999px;background:var(--card2);overflow:hidden;border:1px solid var(--line);margin:8px 0 10px}
.tprog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0%}
.taskcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.taskhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.taskhead h3{margin:0;font-size:16px}
.badge{font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;border-radius:999px;
  padding:3px 9px;background:color-mix(in srgb,var(--acc2) 16%,transparent);color:var(--acc2)}
.instr{font-size:15px;line-height:1.5;margin:6px 0 12px}
.instr b{color:var(--acc)}
.rubric{font-size:13px;color:var(--muted);font-style:italic;margin-top:6px}
.figure{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 6px;margin:12px 0;overflow-x:auto}
.figure svg{width:100%;max-width:640px;height:auto;display:block;margin:0 auto}
.figcap{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.datatable{width:100%;border-collapse:collapse;font-size:12.5px;min-width:300px}
.datatable th,.datatable td{border:1px solid var(--line);padding:5px 7px;text-align:right;white-space:nowrap}
.datatable th:first-child,.datatable td:first-child{text-align:left;font-weight:700}
.datatable thead th{background:color-mix(in srgb,var(--acc2) 12%,transparent);color:var(--txt)}
textarea{width:100%;min-height:220px;background:var(--card2);color:var(--txt);border:1px solid var(--line);
  border-radius:12px;padding:12px;font-family:inherit;font-size:15px;line-height:1.55;resize:vertical}
textarea:focus{outline:2px solid var(--acc2);outline-offset:1px}
.wc{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;margin-top:6px;flex-wrap:wrap}

.wc .ok{color:var(--good)} .wc .no{color:var(--bad)}
.copybox{width:100%;min-height:150px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
details.copyd{margin-top:10px}
details.copyd>summary{cursor:pointer;font-size:13px;color:var(--muted);padding:6px 0}
details.model{border:1px solid var(--line);border-radius:14px;background:var(--card2);margin-top:14px;overflow:hidden}
details.model>summary{cursor:pointer;padding:13px 15px;font-weight:800;font-size:14px;list-style:none;color:var(--acc)}

.modelbody{padding:0 15px 16px}
.essay{font-size:14.5px;line-height:1.6;text-align:left}

  color:#06202b;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:999px;padding:2px 9px;margin-bottom:5px}
.note{font-size:12.5px;line-height:1.5;color:var(--muted);border-left:3px solid var(--line);padding-left:10px;margin:0 0 14px}

.crit{display:grid;gap:9px;margin:10px 0}
.crit div{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:13px;line-height:1.5}
.crit b{color:var(--acc2);font-weight:700}

.reuse{display:grid;gap:7px;margin-top:8px}
.reuse div{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc2);border-radius:9px;
  padding:8px 11px;font-size:13px;line-height:1.45}
.mwords{font-size:12px;color:var(--muted);margin-bottom:10px}
h4.msec{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 6px}
/* — mode corrigés — */
body.corrige .timerbox, body.corrige #wcBtn, body.corrige #randomBtn, body.corrige #t1txt, body.corrige #t2txt,
body.corrige .wc, body.corrige details.copyd, body.corrige #actionsRow, body.corrige .done,
body.corrige details.model{display:none!important}
.walk{margin-top:14px}
.step{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-top:12px}
.step h4{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:9px;line-height:1.3}
.step .num{flex:0 0 auto;width:24px;height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:800;color:#06202b;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.step p{margin:0;font-size:14px;line-height:1.5}
.step ul{margin:0;padding-left:19px}
.step li{margin:5px 0;font-size:14px;line-height:1.5}
.step li b, .step p b{color:var(--acc)}
.step.warn{border-left:4px solid var(--warn)}
.step.good{border-left:4px solid var(--good)}
.step.bad{border-left:4px solid var(--bad)}
.step.bad .num{background:var(--bad);color:#fff}
.weaktxt{font-size:14.5px;line-height:1.6;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.weaktxt p{margin:0 0 8px}
.weaktxt p:last-child{margin:0}
.errs{display:grid;gap:8px}
.errs div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45;
  display:grid;grid-template-columns:1fr auto;gap:3px 10px}
.errs i{grid-column:1/2;color:var(--bad);font-weight:600}
.errs span{grid-column:1/2}
.errs b{grid-column:2/3;grid-row:1/3;align-self:start;font-size:10.5px;font-weight:800;letter-spacing:.3px;color:var(--acc2);
  background:color-mix(in srgb,var(--acc2) 14%,transparent);border-radius:999px;padding:3px 8px;white-space:nowrap}
.done{font-size:13px;line-height:1.5;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--acc);
  border-radius:12px;padding:11px 13px;margin-top:12px}

<header>
  <div class="wrap">
    <div class="hrow">
      <div class="logo" id="pageTitle">⏱️ Examens blancs IELTS
        <small>Format officiel · 60 minutes · correction par copier-coller</small>

<main class="wrap">

  <!-- ===== TASK 1 ===== -->

      <span class="muted" style="margin-left:auto">≈ 20 min · 150 mots min.</span>

    et la grille de correction (4 critères officiels, note par critère, erreurs corrigées, version réécrite band 8+).
    <br><br>
    <b>Conditions réelles</b> — le correcteur orthographique est désactivé, comme dans le vrai test.

t1:{parts:[
 ["Introduction","The line graph shows how the unemployment rate changed in three countries between 2008 and 2024.",
  "<i>shows how … changed</i> : une paraphrase qui annonce d’emblée qu’il s’agit d’évolutions, donc de tendances."],
 ["Overview (obligatoire)","Overall, unemployment ended the period lower than it began in all three countries, but the paths taken were very different. Spain suffered by far the most severe crisis and remained the worst affected throughout, whereas Germany declined steadily to the lowest rate of the three, and the United States fluctuated around a much narrower range.",
  "Trois trajectoires résumées en une phrase chacune, <b>sans aucun chiffre</b> : une crise, un déclin régulier, des fluctuations. L’examinateur voit immédiatement que les données ont été analysées, pas recopiées."],
 ["Corps 1 — l’Espagne","Spain’s figures dwarf those of the other two countries. Its rate stood at 11% in 2008 and then more than doubled, peaking at 25% in 2012 — more than three times the American figure that year. A steady recovery followed, with unemployment falling to 20% in 2016, 16% in 2020 and 12% in 2024, yet even at the end of the period Spain’s rate was four times that of Germany.",
  "Le cas extrême occupe son propre paragraphe. La comparaison est faite <b>en rapports</b> (<i>three times</i>, <i>four times</i>), ce qui parle bien plus qu’une soustraction."],
 ["Corps 2 — l’Allemagne et les États-Unis","Germany, which had the second highest rate in 2008 at 8%, fell continuously throughout the period, to 6% in 2012 and eventually to just 3% in 2024, the lowest point on the graph. The United States followed a far more irregular course: from 6% in 2008 its rate climbed to 8% in 2012, dropped to 5% in 2016, returned to 8% in 2020 and finally fell to 4%.",
  "Les deux séries restantes sont opposées dans le même paragraphe : une baisse <b>continue</b> contre un parcours <b>irrégulier</b>. C’est la comparaison qui structure, pas l’ordre de la légende."]],
 why:[["Task Achievement","Le maximum (25%), le minimum (3%), la trajectoire la plus irrégulière et l’écart final : quatre éléments, quinze valeurs disponibles."],
      ["Coherence &amp; Cohesion","Un paragraphe pour le cas atypique, un pour les deux autres. <i>whereas</i>, <i>yet</i>, <i>far more irregular</i> portent les contrastes."],
      ["Lexical Resource","<i>dwarf, peaking, a steady recovery, continuously, an irregular course, climbed, returned to</i> — aucune répétition de <i>increase</i> ou <i>decrease</i>."],
      ["Grammatical Range &amp; Accuracy","Relative en incise (<i>Germany, which had the second highest rate…</i>), <i>more than doubled</i>, séries coordonnées à quatre verbes, tirets et deux-points bien employés."]],
 reuse:["The line graph shows how […] changed in three countries between […] and […].",
        "Overall, […] ended the period lower than it began in all three, but the paths taken were very different.",
        "[X]’s figures dwarf those of the other two countries.",
        "Its rate stood at […] and then more than doubled, peaking at […] — more than three times […] that year.",
        "[Y] followed a far more irregular course : from […] its rate climbed to […], dropped to […] and finally fell to […]."]},
t2:{parts:[
 ["Introduction","In most large cities, a first home has moved out of reach for people on average salaries. This essay will argue that the problem stems primarily from a shortage of housing and from the treatment of property as an investment, and that governments can act on both fronts.",
  "L’introduction répond aux <b>deux</b> questions posées (causes, mesures) et annonce déjà les deux causes retenues : le plan est lisible avant même le premier paragraphe."],
 ["Corps 1 — les causes","The first cause is simply that too few homes are built where people want to live. Planning restrictions, a shortage of skilled construction workers and the reluctance of existing residents to accept new developments combine to keep supply well below demand, and prices rise accordingly. The second is that housing has become an asset class: when investors and short-term rental platforms compete with families for the same flats, the price of a property is no longer set by local wages but by the returns available elsewhere in the economy. Wages, meanwhile, have risen far more slowly than property values, so that a deposit which once represented two years of savings can now demand ten.",
  "Deux causes, chacune <b>expliquée par son mécanisme</b>. La seconde va au-delà de l’évidence (« les prix montent ») en nommant ce qui fixe réellement le prix."],
 ["Corps 2 — les mesures","Both causes suggest their own remedy. Governments can accelerate construction by simplifying planning procedures, releasing public land and funding social housing directly, as Vienna has done for a century with notable success. They can also reduce speculative demand through higher taxes on vacant properties and on second homes, and by limiting the conversion of residential flats into short-term tourist accommodation, a measure several European cities have already adopted. Rent controls, by contrast, should be used with caution, since capping prices without increasing supply tends to reduce the number of homes actually available.",
  "Chaque mesure <b>répond à une cause citée</b> — et chacune est attribuée à un acteur précis. Une solution sans acteur ni mécanisme ne rapporte presque rien."],
 ["Conclusion","In conclusion, young people are priced out of the housing market because supply has failed to keep pace with demand and because property has become a financial investment; governments should therefore build far more while making speculation less profitable.",
  "Les deux causes et les deux familles de mesures sont refermées en une phrase, dans le même ordre que dans le corps du texte."]],
 why:[["Task Response","Les deux questions reçoivent une réponse complète, et les mesures découlent explicitement des causes identifiées."],
      ["Coherence &amp; Cohesion","<i>Both causes suggest their own remedy</i> : une charnière logique, plus efficace qu’un <i>Secondly</i>."],
      ["Lexical Resource","<i>out of reach, planning restrictions, an asset class, speculative demand, vacant properties, priced out</i> : le lexique du logement, précis et idiomatique."],
      ["Grammatical Range &amp; Accuracy","Sujets multiples coordonnés, <i>no longer … but …</i>, apposition finale (<i>a measure several European cities have already adopted</i>), point-virgule."]],
 reuse:["This essay will argue that the problem stems primarily from […] and from […], and that governments can act on both fronts.",
        "The first cause is simply that […].",
        "[A], [B] and [C] combine to keep supply well below demand.",
        "Both causes suggest their own remedy.",
        "In conclusion, […] because […] and because […] ; governments should therefore […] while […]."]}

t1:{parts:[
 ["Introduction","The diagram illustrates the stages involved in the production of coffee, from harvesting to distribution.",
  "<i>from harvesting to distribution</i> annonce les bornes du process : c’est une paraphrase, pas un remplissage."],

 ["Corps 1 — la préparation","At the first stage, ripe berries are picked from the plants, after which they are spread out and left to dry in the sun for approximately ten days. The dried berries are then hulled, a process which removes their outer layer, before being sorted according to size and quality. Any beans that fail to meet the required standard are eliminated at this point.",
  "Présent simple passif, connecteurs variés (<i>after which, then, before being</i>), et une relative explicative (<i>a process which removes…</i>) qui évite de juxtaposer deux phrases courtes."],

t2:{parts:[
 ["Introduction","In a growing number of households, screens have become the default form of relaxation for adults and children alike. This essay will explain why this has happened and consider what it means for family life.",
  "Deux questions, deux annonces. <i>for adults and children alike</i> évite de réduire le sujet aux enfants, ce que fait la majorité des copies."],
 ["Corps 1 — les causes","The main reason is that screen-based entertainment has become extraordinarily convenient. A film, a match or an endless stream of short videos is available instantly, at no marginal cost, at any hour and without leaving the sofa, whereas almost every alternative requires planning, money or effort. Economic pressures reinforce this: parents who work long or irregular hours have neither the time nor the energy to organise outings, and a tablet is a cheaper and more reliable form of childcare than any other. Public space has contracted at the same time: in many neighbourhoods there is simply nowhere free to go that is neither a screen nor a shop.",
  "La cause n’est pas morale (« les gens sont paresseux ») mais <b>structurelle</b> : coût, disponibilité, temps. Le contraste <i>whereas almost every alternative requires…</i> est ce qui rend l’explication convaincante."],
 ["Corps 2 — les effets sur la famille","The consequences for family life are mixed but significant. On the one hand, shared viewing can be genuinely sociable, and video calls keep distant relatives present in daily life in a way that was impossible a generation ago. On the other, individual screens fragment the household: each member retreats into a personal feed, conversation shrinks to the intervals between notifications, and the shared meal — historically the moment when families exchanged news — is increasingly interrupted or abandoned altogether. The effect is not identical everywhere, however: households that keep screens out of bedrooms and away from the table report far fewer difficulties.",
  "La réponse à la seconde question est <b>nuancée</b> : un effet positif reconnu, puis l’effet négatif développé. Un raisonnement à sens unique paraît toujours plus faible."],
 ["Conclusion","In conclusion, screens dominate our leisure time because they are cheap, instant and undemanding, and their main effect on family life is to replace shared activity with parallel solitude — a change that families can resist, but only deliberately.",
  "Une proposition par question. La formule finale (<i>parallel solitude</i>) résume l’idée du paragraphe 2 sans en ajouter de nouvelle."]],

      ["Grammatical Range &amp; Accuracy","<i>neither … nor …</i>, <i>whereas</i>, relative (<i>parents who work long hours</i>), incise entre tirets, comparatif (<i>cheaper and more reliable than…</i>)."]],

 ["Introduction","The two maps show a small island as it was before the construction of a tourist resort and as it appears afterwards.",
  "<i>as it was … and as it appears afterwards</i> : une paraphrase élégante de « before and after », sans recopier la consigne."],
 ["Overview (obligatoire)","Overall, the island has been transformed from an uninhabited, wooded area into a small holiday resort, although its natural boundaries have been preserved. Development is concentrated in the centre and along the southern coast, while the beach and the surrounding sea remain unchanged.",
  "Un <b>changement de caractère</b> (inhabitée → touristique) et la localisation générale des travaux. Aucun bâtiment n’est énuméré : ce sera le rôle des paragraphes de corps."],
 ["Corps 1 — le centre de l’île","The most extensive changes have taken place in the centre, where a substantial part of the woodland has been cleared to make way for buildings. A reception area and a restaurant have been constructed side by side in the north of this zone, and two groups of cabins for visitors have been built to the west and to the east of them. All of these facilities are linked by a network of footpaths.",
  "Structuration <b>par zone</b>, et chaque transformation est à la voix passive sans acteur (<i>has been cleared, have been constructed, have been built</i>), comme l’exige ce type de sujet."],
 ["Corps 2 — la côte et ce qui n’a pas changé","The southern coastline has also been developed: a pier now extends into the sea, allowing boats to reach the island directly, and an area of water off the western beach has been marked out for swimming. The beach itself, however, has been left in its natural state, and no construction has taken place along the eastern shore.",
  "Le paragraphe se termine sur ce qui <b>n’a pas changé</b> — un point que la plupart des candidats omettent, alors qu’il fait partie de la description complète attendue."]],

      ["Grammatical Range &amp; Accuracy","Present perfect passif (<i>has been transformed, have been built</i>), participiale (<i>allowing boats to reach…</i>), relative (<i>where a substantial part…</i>), négation en fin de texte (<i>no construction has taken place</i>)."]],

t2:{parts:[
 ["Introduction","Tourism is welcomed in some regions as a source of prosperity and resented in others as a threat to local life. This essay will examine both positions before arguing that the damage attributed to tourism is usually the result of how it is managed, not of its existence.",
  "Les deux vues <b>et</b> la position, en deux phrases. La thèse est précise : elle ne dit pas « le tourisme est bon », mais déplace le débat vers la gestion — une position bien plus défendable en 250 mots."],
 ["Corps 1 — la vue critique","Those who condemn tourism can point to genuine harm. In historic cities, short-term rentals remove flats from the local market and push residents towards the periphery; in coastal regions, water consumption doubles in summer, precisely when supplies are scarcest. Traditions are also affected, since a craft performed every evening for paying visitors gradually becomes a performance rather than a practice. Venice, whose resident population has fallen by more than half since the 1970s, shows how a city can be emptied by its own popularity.",
  "La vue adverse reçoit des exemples <b>concrets et variés</b> (logement, eau, culture). Bâcler le camp qu’on ne défend pas est l’erreur la plus visible dans une discussion."],
 ["Corps 2 — la vue favorable et la position","Against this, tourism often provides the only realistic alternative to emigration. In regions where agriculture no longer supports a population, visitor spending sustains restaurants, transport and craft workshops, and the tax revenue it generates funds schools and clinics that would otherwise close. Employment matters as much as income: a hotel or a guiding business gives young people a reason to stay in a village that would otherwise lose them to the nearest city. The decisive point, in my view, is that the abuses described above are all consequences of unregulated growth: cities that cap rental licences and regions that invest tourist taxes in local infrastructure obtain the income without the damage.",
  "La seconde vue est exposée, puis la position tranche en <b>reliant les deux paragraphes</b> : les dégâts cités plus haut sont requalifiés en défauts de régulation. C’est un raisonnement, pas une préférence."],
 ["Conclusion","In conclusion, although unmanaged tourism can undoubtedly displace residents and erode local traditions, I believe that with firm regulation it remains one of the few reliable sources of income available to rural and coastal communities.",
  "Concession, puis position identique à celle de l’introduction. La conclusion d’une discussion doit trancher, pas résumer les deux camps à égalité."]],
 why:[["Task Response","Les deux vues sont développées avec le même sérieux, et l’opinion, annoncée dès l’introduction, est justifiée plutôt qu’affirmée."],
      ["Coherence &amp; Cohesion","<i>Against this</i> puis <i>The decisive point, in my view, is that…</i> : les bascules sont explicites et le second paragraphe recycle le premier au lieu de l’ignorer."],
      ["Lexical Resource","<i>resented, short-term rentals, the periphery, a performance rather than a practice, sustains, unregulated growth, cap rental licences</i>."],
      ["Grammatical Range &amp; Accuracy","Point-virgule pour opposer deux exemples parallèles, <i>since</i> causal, relative (<i>clinics that would otherwise close</i>), conditionnel implicite (<i>would otherwise close</i>)."]],

/* ============================================================
   LOGIQUE
   ============================================================ */
const MODE = window.IELTS_MODE || (location.hash === "#corriges" ? "corrige" : "exam");
window.addEventListener("hashchange", function(){ location.reload(); });
const LS = MODE === "corrige" ? "ielts-corrige-v1" : "ielts-exam-v1";
let S = { exam:0, answers:{}, theme:"dark", showWc:true };
function load(){ try{ const r = localStorage.getItem(LS); if(r) S = Object.assign(S, JSON.parse(r)); }catch(e){} }
function save(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
function applyTheme(){
  document.documentElement.setAttribute("data-theme", S.theme==="light" ? "light" : "dark");
  $("themeBtn").textContent = S.theme==="light" ? "☀️" : "🌙";
}
$("themeBtn").addEventListener("click", function(){ S.theme = S.theme==="light"?"dark":"light"; save(); applyTheme(); });

let toastT=null;
function toast(m){ const el=$("toast"); el.textContent=m; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove("show"); },1600); }

function words(t){ const a = t.trim().split(/\\s+/).filter(Boolean); return a.length; }
function ansKey(i){ return "e"+i; }
function curAns(){ return S.answers[ansKey(S.exam)] || {t1:"",t2:""}; }

function renderModel(el, m, task){
  const full = m.parts.map(function(p){ return p[1]; }).join(" ");
  const n = full.trim().split(/\\s+/).length;
  let h = '<div class="mwords">Modèle de <b>'+n+' mots</b> · minimum exigé : '+(task===1?150:250)
        + ' · rédigé dans le temps imparti ('+(task===1?"20":"40")+' min)</div><div class="essay">';
  m.parts.forEach(function(p){
    h += '<span class="lbl">'+p[0]+'</span><p>'+p[1]+'</p><div class="note">'+p[2]+"</div>";
  });
  h += '</div><h4 class="msec">Pourquoi ce texte vaudrait un band 9</h4><div class="crit">';
  m.why.forEach(function(w){ h += "<div><b>"+w[0]+"</b>"+w[1]+"</div>"; });
  h += '</div><h4 class="msec">Structures à réutiliser telles quelles</h4><div class="reuse">';
  m.reuse.forEach(function(r){ h += "<div>"+r+"</div>"; });
  el.innerHTML = h + "</div>";
}
function lis(a){ return "<ul>" + a.map(function(x){ return "<li>"+x+"</li>"; }).join("") + "</ul>"; }
function renderWalk(el, w, m, task){
  if(!w || !m){ el.innerHTML = ""; return; }
  const n = w.weak.text.trim().split(/\\s+/).length;
  el.innerHTML =
      '<div class="step"><h4><span class="num">1</span>Identifier le sujet</h4><p>'+w.type+'</p></div>'
    + '<div class="step"><h4><span class="num">2</span>'
    +   (task===1 ? "Repérer l’essentiel (2 minutes)" : "Trouver et trier les idées (3 minutes)") + '</h4>' + lis(w.spot) + '</div>'
    + '<div class="step"><h4><span class="num">3</span>Faire le plan</h4>' + lis(w.plan) + '</div>'
    + '<div class="step warn"><h4><span class="num">4</span>Les pièges propres à ce sujet</h4>' + lis(w.traps) + '</div>'
    + '<div class="step good"><h4><span class="num">5</span>Rédiger : la copie band 9, commentée</h4><div class="mhost"></div></div>'
    + '<div class="step bad"><h4><span class="num">✗</span>La même tâche ratée — copie estimée ≈ band '+w.weak.band+'</h4>'
    +   '<div class="weaktxt">' + w.weak.text.split(/\\n\\n+/).map(function(p){ return "<p>"+p+"</p>"; }).join("") + '</div>'
    +   '<div class="mwords" style="margin-top:6px">'+n+' mots — minimum exigé : '+(task===1?150:250)+'</div>'
    +   '<h4 class="msec">Ce qui fait perdre des points, phrase par phrase</h4><div class="errs">'
    +   w.weak.errs.map(function(e){ return "<div><i>"+e[0]+"</i><span>"+e[1]+"</span><b>"+e[2]+"</b></div>"; }).join("")
    +   '</div></div>';
  renderModel(el.querySelector(".mhost"), m, task);
}
function renderExam(){
  const e = EXAMS[S.exam];
  $("t1kind").textContent = e.t1kind;
  $("t2kind").textContent = e.t2kind;
  $("t1instr").textContent = e.t1;
  $("t1fig").innerHTML = renderChart(e.chart);
  $("t1cap").textContent = e.cap;
  $("t1data").innerHTML = "<pre style=\\"white-space:pre-wrap;font-size:12.5px;margin:6px 0 0\\">"+dataText(e.chart)+"</pre>";
  $("t1dataWrap").open = false;
  $("t2instr").textContent = e.t2;
  const mod = MODELS[S.exam];
  if(MODE === "corrige"){
    renderWalk($("w1"), WALK[S.exam] && WALK[S.exam].t1, mod && mod.t1, 1);
    renderWalk($("w2"), WALK[S.exam] && WALK[S.exam].t2, mod && mod.t2, 2);
    $("t1dataWrap").open = true;
  }
  document.querySelectorAll("details.model").forEach(function(d){ d.style.display = mod ? "" : "none"; });
  if(mod){ renderModel($("m1"), mod.t1, 1); renderModel($("m2"), mod.t2, 2); }
  document.querySelectorAll("details.model").forEach(function(d){ d.open = false; });
  const a = curAns();
  $("t1txt").value = a.t1; $("t2txt").value = a.t2;
  updateWc();
  $("examSel").value = String(S.exam);
}
(function buildSel(){
  $("examSel").innerHTML = EXAMS.map(function(e,i){
    const name = MODE === "corrige" ? e.n.replace("Examen","Exercice corrigé") : e.n;
    return '<option value="'+i+'">'+name+" — "+e.t1kind+" + "+e.t2kind+"</option>";
  }).join("");
})();
$("examSel").addEventListener("change", function(){ S.exam = parseInt(this.value,10); save(); renderExam(); resetTimer(); });
$("randomBtn").addEventListener("click", function(){
  let i = S.exam; while(EXAMS.length>1 && i===S.exam) i = Math.floor(Math.random()*EXAMS.length);
  S.exam = i; save(); renderExam(); resetTimer(); toast(EXAMS[i].n);
});
$("wcBtn").addEventListener("click", function(){
  S.showWc = !S.showWc; save(); this.classList.toggle("on", S.showWc); updateWc();
  toast(S.showWc ? "Compteur affiché" : "Mode papier : compteur masqué");
});

function wcLabel(el, n, min){
  if(!S.showWc){ el.innerHTML = '<span class="muted">Compteur masqué (mode papier)</span>'; return; }
  const ok = n >= min;
  el.innerHTML = "<b class=\\""+(ok?"ok":"no")+"\\">"+n+"</b> mot"+(n>1?"s":"")
    + ' <span class="muted">· minimum '+min+(ok?" ✅":" — il en manque "+(min-n))+"</span>";
}
function updateWc(){
  wcLabel($("t1wc"), words($("t1txt").value), 150);
  wcLabel($("t2wc"), words($("t2txt").value), 250);
}
function onType(){
  S.answers[ansKey(S.exam)] = {t1:$("t1txt").value, t2:$("t2txt").value};
  save(); updateWc();
}
$("t1txt").addEventListener("input", onType);
$("t2txt").addEventListener("input", onType);
$("clearBtn").addEventListener("click", function(){
  if(!confirm("Effacer vos réponses pour "+EXAMS[S.exam].n+" ?")) return;
  delete S.answers[ansKey(S.exam)]; save(); $("t1txt").value=""; $("t2txt").value=""; updateWc();
  toast("Réponses effacées");
});

/* — chronomètre 60 minutes — */
const TOTAL = 60*60;
let left = TOTAL, tick = null, running = false;
function fmt(s){ const m = Math.floor(Math.abs(s)/60), x = Math.abs(s)%60;
  return (s<0?"-":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"); }
function paintClock(){
  const c = $("clock");
  c.textContent = fmt(left);
  c.classList.toggle("warn", left<=10*60 && left>0);
  c.classList.toggle("over", left<=0);
  $("tprog").style.width = Math.max(0, Math.min(100,(TOTAL-left)/TOTAL*100))+"%";
  const used = TOTAL-left;
  $("clockLbl").textContent = left<=0 ? "⏰ Temps écoulé — dans le vrai test, vous devez rendre votre copie."
    : used < 20*60 ? "Task 1 recommandée jusqu’à 20:00 écoulées (reste "+fmt(20*60-used)+" sur la Task 1)"
    : "Vous devriez être sur la Task 2 — il reste "+fmt(left)+" pour la terminer";
}
function startTimer(){
  if(running) return;
  running = true; $("startBtn").textContent = "▶️ En cours…";
  tick = setInterval(function(){ left--; paintClock(); if(left===0) toast("⏰ Temps écoulé"); }, 1000);
}
function pauseTimer(){ running=false; clearInterval(tick); tick=null; $("startBtn").textContent="▶️ Reprendre"; }
function resetTimer(){ pauseTimer(); left = TOTAL; $("startBtn").textContent="▶️ Démarrer l’épreuve"; paintClock(); }
$("startBtn").addEventListener("click", startTimer);
$("pauseBtn").addEventListener("click", pauseTimer);
$("resetTimeBtn").addEventListener("click", function(){ if(confirm("Remettre le chronomètre à 60:00 ?")) resetTimer(); });

/* — construction du texte de correction — */
const GRID = "Tu es examinateur IELTS Academic certifié. Corrige ma copie ci-dessous en appliquant STRICTEMENT les descripteurs officiels, sans complaisance.\\n\\n"
 + "Pour CHACUN des 4 critères, donne une note en bandes (0–9, demi-points autorisés) et deux phrases de justification citant mon texte :\\n"
 + "1. Task Achievement / Task Response\\n2. Coherence and Cohesion\\n3. Lexical Resource\\n4. Grammatical Range and Accuracy\\n\\n"
 + "Puis fournis :\\n"
 + "- la note globale de la tâche (moyenne des 4 critères, arrondie selon les règles IELTS) ;\\n"
 + "- les 3 problèmes qui me coûtent le plus de points, classés par impact ;\\n"
 + "- la liste complète de mes erreurs, au format : « ma phrase » → correction → la règle en une ligne ;\\n"
 + "- une version réécrite de MA réponse au niveau band 8+, qui garde mes idées et ma structure ;\\n"
 + "- 3 consignes concrètes à appliquer à ma prochaine rédaction.\\n"
 + "Vérifie aussi que mes chiffres et mes comparaisons correspondent bien aux données fournies.";

function block(task){
  const e = EXAMS[S.exam];
  if(task===1){
    const t = $("t1txt").value.trim();
    return "===== IELTS ACADEMIC WRITING TASK 1 (20 minutes, 150 mots minimum) =====\\n"
      + "You should spend about 20 minutes on this task.\\n\\n" + e.t1 + "\\n\\n"
      + "Summarise the information by selecting and reporting the main features, and make comparisons where relevant.\\n"
      + "Write at least 150 words.\\n\\n"
      + "--- Données du sujet (" + e.cap + ") ---\\n" + dataText(e.chart) + "\\n\\n"
      + "===== MA RÉPONSE (" + words(t) + " mots) =====\\n" + (t || "(vide)");
  }
  const t = $("t2txt").value.trim();
  return "===== IELTS ACADEMIC WRITING TASK 2 (40 minutes, 250 mots minimum) =====\\n"
    + "You should spend about 40 minutes on this task.\\n\\nWrite about the following topic:\\n\\n" + e.t2 + "\\n\\n"
    + "Give reasons for your answer and include any relevant examples from your own knowledge or experience.\\n"
    + "Write at least 250 words.\\n\\n"
    + "===== MA RÉPONSE (" + words(t) + " mots) =====\\n" + (t || "(vide)");
}
function fullText(which){
  const e = EXAMS[S.exam];
  const head = GRID + "\\n\\n(" + e.n + " · temps écoulé : " + fmt(TOTAL-left) + " sur 60:00)\\n\\n";
  if(which==="t1") return head + block(1);
  if(which==="t2") return head + block(2);
  return head + block(1) + "\\n\\n\\n" + block(2)
    + "\\n\\nTermine par une estimation de ma note globale de Writing (Task 1 comptant pour un tiers et Task 2 pour deux tiers).";
}
function copy(which, boxId){
  const txt = fullText(which);
  if(boxId) $(boxId).value = txt;
  const done = function(){ toast("✅ Copié — collez-le dans Claude"); };
  const fail = function(){
    toast("Copie impossible : utilisez le bloc « texte à copier »");
    if(boxId){ const b=$(boxId); b.closest("details").open = true; b.focus(); b.select(); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(function(){
      try{ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
        ta.select(); const ok=document.execCommand("copy"); ta.remove(); ok?done():fail();
      }catch(e){ fail(); }
    });
  }else{
    try{ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta);
      ta.select(); const ok=document.execCommand("copy"); ta.remove(); ok?done():fail();
    }catch(e){ fail(); }
  }
}
$("t1copy").addEventListener("click", function(){ copy("t1","t1box"); });
$("t2copy").addEventListener("click", function(){ copy("t2","t2box"); });
$("allCopy").addEventListener("click", function(){ copy("all","t1box"); });

/* — démarrage — */
if(MODE === "corrige"){
  document.body.classList.add("corrige");
  document.title = "IELTS Writing — Exercices corrigés";
  $("pageTitle").innerHTML = "📗 Exercices corrigés<small>La démarche complète, étape par étape, puis la copie band 9 et une copie ratée</small>";
  $("navCo").classList.add("on"); $("navEx").classList.remove("on");
}
load();
applyTheme();
$("wcBtn").classList.toggle("on", S.showWc);
if(S.exam < 0 || S.exam >= EXAMS.length) S.exam = 0;
renderExam();
paintClock();
<\/script>
</body>
</html>
`;

const KEYS = {t1:"ielts-t1-v1", t2:"ielts-t2-v1", co:"ielts-corrige-v1", ex:"ielts-exam-v1"};
const frames = document.getElementById("frames");
const made = {};
let current = null;

function show(k){
  if(!made[k]){
    const f = document.createElement("iframe");
    f.setAttribute("allow","clipboard-write");
    f.setAttribute("title", k);
    f.srcdoc = APPS[k];
    frames.appendChild(f);
    made[k] = f;
  }
  Object.keys(made).forEach(function(x){ made[x].classList.toggle("on", x===k); });
  document.querySelectorAll("#bar .tab").forEach(function(b){ b.classList.toggle("on", b.dataset.k===k); });
  current = k;
  try{ localStorage.setItem("ielts-shell-tab", k); }catch(e){}
  syncTheme();
}
document.querySelectorAll("#bar .tab").forEach(function(b){
  b.addEventListener("click", function(){ show(b.dataset.k); });
});

/* la barre suit le thème clair/sombre choisi dans l'application affichée */
function syncTheme(){
  let theme = null;
  try{
    const raw = localStorage.getItem(KEYS[current]);
    if(raw) theme = (JSON.parse(raw)||{}).theme;
  }catch(e){}
  if(!theme) theme = "dark";
  document.documentElement.setAttribute("data-theme", theme);
}
setInterval(syncTheme, 900);

let start = "t1";
try{ const s = localStorage.getItem("ielts-shell-tab"); if(s && APPS[s]) start = s; }catch(e){}
show(start);
</script>
</body>
</html>
